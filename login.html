<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 — onecue</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=1f228d76">
<style>
.box{max-width:400px;margin:0 auto}
.tabs{display:flex;gap:0;border:1px solid var(--rule);border-radius:9px;overflow:hidden;
  margin-bottom:22px}
.tabs button{flex:1;padding:10px;border:0;background:var(--panel);color:var(--muted);
  font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
.tabs button.on{background:var(--cue);color:#fff;font-weight:700}
.f{margin-bottom:16px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;
  font-family:"JetBrains Mono",monospace}
.f input{width:100%;padding:11px 13px;border:1px solid var(--rule);border-radius:9px;
  background:var(--panel);color:var(--ink);font-family:inherit;font-size:15px}
.f input:focus{outline:2px solid var(--cue);outline-offset:1px;border-color:var(--cue)}
.msg{font-size:13.5px;margin-top:12px;min-height:20px}
.msg.err{color:var(--cue)}
.msg.ok{color:var(--live)}
.who{background:var(--panel);border:1px solid var(--rule);border-radius:11px;
  padding:18px 20px;display:none}
.who.on{display:block}
.who .em{font-weight:700;font-size:16px}
.who .rl{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);
  margin-top:2px}
.who .actions{margin-top:14px}
.need{border-color:var(--cue)!important;box-shadow:0 0 0 1px var(--cue)}
.hintbox{font-size:12.5px;color:var(--muted);background:var(--sunk);
  border:1px solid var(--rule);border-radius:9px;padding:12px 14px;margin-top:18px}
</style>
<link rel="stylesheet" href="studio.css?v=2"><script defer src="studio-shell.js?v=6"></script>
<link rel="stylesheet" href="brand.css?v=red1"><link rel="stylesheet" href="skin-v2.css?v=13"><style id="onecue-client-v11">
/* task144: page-local v1.1 palette; shared styles stay read-only. */
:root,:root[data-theme=light],:root[data-theme=dark]{
 --accent:#d7ff3a;--ink:#111;--ink-2:#333;--muted:#767676;--dim:#c4c4c4;--line:#e4e4e4;--line-2:#ddd;
 --bg2:#fff;--ground:#fff;--panel:#fff;--sunk:#f5f5f5;--faint:#767676;--rule:var(--line);
 --accent-ink:var(--ink);--brand:var(--accent);--brand-strong:var(--ink);--brand-soft:rgba(215,255,58,.18);
 --cue:var(--ink);--cue-soft:var(--brand-soft);--live:#287449;--live-soft:#e8f3ec;--hold:#866015;--hold-soft:#faf0d9;
 --error:#b42318;color-scheme:light;
}
html,body,body.studio-layout{background:var(--ground)!important;color:var(--ink)}
.studio-rail{background:var(--panel)!important;border-color:var(--rule)!important}
.studio-rail nav a{color:var(--ink-2)!important}
.studio-rail nav a:hover{background:var(--sunk)!important;color:var(--ink)!important}
.studio-rail nav a.on,.studio-rail nav a.on:hover{background:var(--accent)!important;color:var(--ink)!important}
.studio-brand.v2 .dot{box-shadow:0 0 0 1px var(--ink)}
.studio-workspace>span{color:var(--ink)!important}
.studio-layout .topbar,body.studio-layout>header{background:rgba(255,255,255,.94)!important}
.studio-layout .lede,.studio-heading p,.studio-layout p{color:var(--ink-2)}
.studio-layout a{color:var(--ink)}
.studio-layout .btn.ghost,.studio-layout .btn.secondary,.studio-layout .btn.light{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line-2)!important}
.studio-layout .btn.ghost:hover{background:var(--sunk)!important}
.studio-layout input::placeholder,.studio-layout textarea::placeholder{color:var(--muted);opacity:1}
.studio-layout :is(input,textarea,select):focus-visible{outline-color:var(--ink)!important}
.studio-layout :is(button,a):focus-visible{outline-color:var(--ink)!important}
.studio-layout .msg.err,.studio-layout .pill.bad{color:var(--error)!important;background:#fff0ef!important}
.studio-layout .msg.ok{color:var(--live)!important}
.studio-layout .pill:not(.ok):not(.bad){color:var(--ink-2)}
.studio-layout input,.studio-layout textarea,.studio-layout select{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line-2)!important}
.studio-layout label{color:var(--ink)}
.studio-layout .studio-workspace small,.studio-layout .studio-navlabel,.studio-layout .studio-railfoot,.studio-layout .studio-railfoot small{color:var(--muted)!important}
.studio-layout .prose p,.studio-layout .facts strong,.studio-layout summary h2{color:var(--ink-2)!important}
.studio-layout .gate small,.studio-layout summary small{color:var(--ink-2)}
.studio-layout .st-act,.studio-layout .tag.st-act,.studio-layout .cstep-s.st-act{background:#fde3dc!important;color:#b42318!important;border-color:#f5b7a8!important}
.studio-layout .st-run,.studio-layout .tag.st-run,.studio-layout .cstep-s.st-run{background:#e5efff!important;color:#1d4ed8!important;border-color:#bcd3fb!important}
.studio-layout .st-done,.studio-layout .tag.st-done,.studio-layout .cstep-s.st-done{background:#e3f4ea!important;color:#1f7a4d!important;border-color:#b5dfc6!important}
.studio-layout .st-fix,.studio-layout .tag.st-fix,.studio-layout .cstep-s.st-fix{background:#fff1db!important;color:#a15c00!important;border-color:#f5d39b!important}

.studio-layout .tabs button.on{background:var(--accent);color:var(--ink)}
.studio-layout .f label b{color:var(--ink)!important}
.studio-layout .need{border-color:var(--error)!important;box-shadow:0 0 0 1px var(--error)}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <a class="mark" href="index.html"><span class="lamp"></span>onecue
    <span class="sub">광고 기획 · 제작</span></a>
  <div class="spacer"></div>
  <span class="pill" id="conn"><span class="dot"></span>확인 중</span>
</div></div>

<main>
  <div class="box">

    <!-- 이미 로그인돼 있으면 이쪽만 보인다 -->
    <div class="who" id="who">
      <h2 style="margin-top:0">로그인됨</h2>
      <div class="em" id="whoNick"></div>
      <div class="rl" id="whoEmail"></div>
      <div class="rl" id="whoRole"></div>

      <div class="f" style="margin-top:16px">
        <label for="nick2">닉네임 바꾸기</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="nick2" maxlength="20" style="flex:1">
          <button class="btn ghost" type="button" id="saveNick">저장</button>
        </div>
        <div class="msg" id="nickMsg"></div>
      </div>

      <div class="f" id="phoneBox" style="margin-top:16px">
        <label for="phone2">연락처 — 영상이 완성되면 이 번호로 알려 드립니다</label>
        <div style="display:flex;gap:8px">
          <input type="tel" id="phone2" inputmode="tel" maxlength="13" placeholder="010-1234-5678" autocomplete="tel" style="flex:1">
          <button class="btn ghost" type="button" id="savePhone">저장</button>
        </div>
        <div class="msg" id="phoneMsg"></div>
      </div>

      <div class="actions">
        <a class="btn" id="goAdmin" href="admin.html" hidden>관리자 화면 →</a>
        <a class="btn ghost" href="index.html">첫 화면</a>
        <button class="btn ghost" id="logout">로그아웃</button>
      </div>
    </div>

    <form id="form">
      <h2>로그인</h2>
      <div class="tabs">
        <button type="button" id="tabIn" class="on">로그인</button>
        <button type="button" id="tabUp">처음이신가요</button>
      </div>
      <div class="f">
        <label for="email">이메일 — 이게 아이디입니다</label>
        <input type="text" id="email" required autocomplete="username" placeholder="아이디 또는 메일 주소">
      </div>
      <div class="f" id="nickWrap" hidden>
        <label for="nick">닉네임 — 선택. 안 정하면 이메일이 표시됩니다</label>
        <input type="text" id="nick" maxlength="20" placeholder="예 · 김담당">
      </div>
      <div class="f" id="phoneWrap" hidden>
        <label for="phone">연락처 <b style="color:var(--cue)">필수</b> — 영상 완성 알림(문자·알림톡)을 받을 휴대폰 번호</label>
        <input type="tel" id="phone" inputmode="tel" maxlength="13" placeholder="010-1234-5678" autocomplete="tel">
      </div>
      <div class="f">
        <label for="pw">비밀번호 — 6자 이상</label>
        <input type="password" id="pw" required minlength="6" autocomplete="current-password">
      </div>
      <button class="btn" type="submit" id="go" style="width:100%;justify-content:center">
        로그인</button>
      <button class="btn ghost" type="button" id="forgot" style="width:100%;justify-content:center;margin-top:8px">
        비밀번호를 잊으셨나요?</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <p class="hintbox">의뢰 접수와 진행 확인은 <b>로그인 후 이용할 수 있습니다.</b><br>
        접수한 계정으로 로그인하면 본인의 프로젝트를 확인할 수 있습니다.</p>
    </form>

    <form id="resetForm" hidden>
      <h2>새 비밀번호 설정</h2>
      <p class="hintbox">메일의 재설정 링크를 확인했습니다. 새 비밀번호를 입력해 주세요.</p>
      <div class="f">
        <label for="newPw">새 비밀번호 — 6자 이상</label>
        <input type="password" id="newPw" required minlength="6" autocomplete="new-password">
      </div>
      <div class="f">
        <label for="newPw2">새 비밀번호 확인</label>
        <input type="password" id="newPw2" required minlength="6" autocomplete="new-password">
      </div>
      <button class="btn" type="submit" id="savePw" style="width:100%;justify-content:center">비밀번호 변경</button>
      <div class="msg" id="resetMsg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <footer><span>onecue</span><span class="mono" id="stamp"></span></footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=d4d97baa"></script>
<script src="login.js?v=ph261019"></script>
</body>
</html>
