<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가격표 — ONECUE</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ONECUE 광고 제작 가격표. 제작비 10만원부터.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230d0d0e%22/%3E%3Ccircle cx=%2211%22 cy=%2211%22 r=%223%22 fill=%22%23d7ff3a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 첫 페이지(index.html, 개발킷 v4)와 같은 토큰 — 다크 단일 테마 */
:root{--bg:#0d0d0e;--ink:#f4f2ef;--accent:#d7ff3a;--mute:rgba(244,242,239,.56);--line:rgba(244,242,239,.14);
  --sans:"Pretendard",system-ui,sans-serif;--mono:"IBM Plex Mono","Pretendard",monospace;--disp:"Anton","Pretendard",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(16px,5vw,80px)}
.logo{font-family:var(--disp);font-size:22px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ask{font-family:var(--mono);font-size:13px;font-weight:600;padding:10px 16px;border:1px solid var(--line);border-radius:999px}
.ask:hover{border-color:var(--accent);color:var(--accent)}
main{max-width:880px;margin:0 auto;padding:clamp(48px,10vh,120px) clamp(16px,5vw,80px) 80px}
.label{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
h1{font-weight:900;font-size:clamp(44px,8vw,96px);line-height:1.02;letter-spacing:-.04em;margin:18px 0 22px;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.body{font-family:var(--mono);font-size:15px;line-height:1.75;color:var(--mute);max-width:60ch;margin:0}
.box{margin-top:44px;border:1px dashed var(--line);border-radius:14px;padding:28px;font-family:var(--mono);font-size:14px;color:var(--mute)}
.ctas{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:40px}
.pill{font-family:var(--mono);font-weight:600;font-size:15px;padding:14px 22px;border-radius:999px;background:var(--accent);color:#0d0d0e;display:inline-flex;align-items:center;gap:10px}
.tlink{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:3px}
.tlink:hover{color:var(--accent);border-color:var(--accent)}
.ico svg{width:7px;height:8px;fill:currentColor;display:block}
</style>
</head>
<body>
<header>
  <a href="index.html" class="logo" aria-label="ONECUE 첫 페이지">ONECUE<span class="dot"></span></a>
  <a href="new.html" class="ask">10만원부터 의뢰</a>
</header>
<main>
  <div class="label">03 — 가격</div>
  <h1><em>10만원</em>부터.</h1>
  <p class="body">예산에 맞춰 고르세요. 어떤 가격대든 완성도 기준은 같습니다.</p>
  <div class="box">자세한 가격표는 준비 중입니다.</div>
  <div class="ctas">
    <a href="new.html" class="pill">광고 제작 의뢰하기 <span class="ico"><svg viewBox="0 0 7 8"><path d="M0 0l7 4-7 4z"/></svg></span></a>
    <a href="index.html" class="tlink">첫 페이지로</a>
  </div>
</main>
</body>
</html>
