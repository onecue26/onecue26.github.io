<!doctype html>
<html lang="ko">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex">
<title>채팅 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#181818;--bg-deep:#0f0f0f;--card:#303030;--surface-raised:#3a3a3a;--ink:#f2f2f2;--text-soft:#a8a8a8;--text-muted:#8a8a8a;
  --line:#ffffff1a;--hairline:#ffffff14;--border-strong:#ffffff24;
  --accent:#d4f53c;--on-accent:#12140a;--accent-tint:#d4f53c29;--accent-border:#d4f53c80;
  --rose:#f06f86;--rose-deep:#ff3b5c;--coral:#ff7173;--glass-dark:#18181875;
  --r-sm:10px;--r-lg:18px;--r-3xl:26px;--r-pill:999px;--shadow-md:0 6px 20px #00000059;
  --ease-out:cubic-bezier(.22,1,.36,1);--dur:.2s;--overlay-h:54%;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg-deep);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;margin:0}
button:disabled{cursor:default}
svg{display:block}

/* ───────── PC 레이아웃 (기본, ≥1024px) ───────── */
.player{display:grid;grid-template-columns:minmax(0,1fr) clamp(384px,34vw,484px);grid-template-rows:auto minmax(0,1fr);
  height:100%;max-width:1440px;margin:0 auto;background:var(--bg);position:relative}
.media{grid-column:1;grid-row:1/3;position:relative;overflow:hidden;background:var(--bg-deep)}
.backdrop{position:absolute;inset:-10%;background:#000 center/cover no-repeat;filter:blur(36px) brightness(.5) saturate(1.12);transform:scale(1.2);transition:background-image .4s}
.stage-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%;opacity:0;transition:opacity .35s ease, filter .4s;background:transparent}
.stage-video.on{opacity:1}
.media.wip .stage-video.on{filter:brightness(.5) saturate(.7)}
.stage-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,#0000003d 0,transparent 22%,transparent 60%,#00000066 100%);display:none}
.imagine-vignette{position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 140px #f06f8666, inset 0 0 40px #f06f8633;animation:fadeIn .6s both}
.stage-tag{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:2;display:inline-flex;align-items:center;gap:7px;max-width:88%;
  background:var(--glass-dark);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border-strong);
  color:#fff;font-size:12px;font-weight:600;padding:7px 13px;border-radius:var(--r-pill);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fadeIn .4s both}
.stage-tag.rose{border-color:#f06f8699;color:#ffd1da;background:#2a151b99}
.stage-tag.wip{border-color:#ffffff3a;color:#e6e6e6}
.stage-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--rose-deep);flex:none;animation:blink 1.2s infinite}
.stage-tag.wip .dot{background:#ffcf5a}
.media-controls{position:absolute;right:16px;bottom:16px;z-index:4;display:flex;flex-direction:column;gap:10px;transition:bottom .3s var(--ease-out)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:var(--glass-dark);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff24;box-shadow:var(--shadow-md);transition:background var(--dur),transform var(--dur)}
.icon-btn:active{transform:scale(.94)}
.icon-btn[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent-border);color:var(--accent)}
.icon-btn.peek{display:none}
.icon-btn .ico-b{display:none}
.icon-btn[aria-pressed="true"] .ico-a{display:none}
.icon-btn[aria-pressed="true"] .ico-b{display:block}
.play-gate{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#00000055;border:0;color:#fff;cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent}
.play-gate__ring{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#141414;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 32px #00000080;padding-left:4px;animation:gatePulse 1.6s ease-in-out infinite}
.play-gate__txt{font-size:14px;font-weight:600;letter-spacing:.02em;text-shadow:0 1px 6px #000}
@keyframes gatePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.sound-hint{position:absolute;right:68px;bottom:22px;z-index:4;background:var(--glass-dark);backdrop-filter:blur(10px);border:1px solid #ffffff24;color:#fff;font-size:12px;padding:7px 11px;border-radius:var(--r-pill);white-space:nowrap;animation:fadeIn .4s both}
.sound-hint::after{content:"";position:absolute;right:-5px;top:50%;width:8px;height:8px;background:#232323;border-right:1px solid #ffffff24;border-top:1px solid #ffffff24;transform:translateY(-50%) rotate(45deg)}

.hud{grid-column:2;grid-row:1;display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--hairline);border-left:1px solid var(--hairline);background:var(--bg)}
.backbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-size:26px;line-height:1;padding-bottom:3px;background:var(--surface-raised)}
.hud-text{min-width:0;flex:1}
.hud-name{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-place{font-size:13px;color:var(--text-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-demo{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text-muted);border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:3px 8px;white-space:nowrap}

.overlay{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--hairline);background:var(--bg);transition:transform .3s var(--ease-out)}
.convo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 18px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#ffffff22 transparent}
.convo>*{animation:riseIn .32s var(--ease-out) both}
.scene-divider{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:11px;font-weight:600;letter-spacing:.04em;margin:6px 0 2px;white-space:nowrap}
.scene-divider::before,.scene-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.caption{white-space:pre-line;align-self:flex-start;max-width:100%;font-size:14px;line-height:1.55;color:var(--text-soft);border-left:2px solid var(--border-strong);padding:2px 0 2px 12px;word-break:keep-all;overflow-wrap:anywhere}
.caption.imagine{border-left-color:var(--rose);color:#f3c9d1}
.row{display:flex;flex-direction:column;gap:4px;max-width:70%}
.row.bot{align-self:flex-start}
.row.user{align-self:flex-end;align-items:flex-end;max-width:78%}
.who{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink)}
.who .av{width:22px;height:22px;border-radius:50%;background:url("img/avatar.jpg") 50% 14%/cover;flex:none;border:1px solid #ffffff2a}
.bubble{font-size:15px;line-height:1.5;padding:11px 15px;border-radius:var(--r-lg);word-break:keep-all;overflow-wrap:anywhere;
  background:var(--card);border:1px solid var(--hairline);color:var(--ink)}
.bot .bubble{border-bottom-left-radius:6px}
.user .bubble{background:var(--accent);color:var(--on-accent);border:0;border-bottom-right-radius:6px}
.bubble.typing{display:inline-flex;gap:5px;align-items:center;padding:14px 16px;min-width:56px}
.bubble.typing i{width:6px;height:6px;border-radius:50%;background:#ffffff8c;animation:dots 1.1s infinite}
.bubble.typing i:nth-child(2){animation-delay:.18s}.bubble.typing i:nth-child(3){animation-delay:.36s}
.end-note{align-self:center;text-align:center;font-size:12px;color:var(--text-muted);line-height:1.6;padding:6px 0}

.dock{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.suggest-chips{display:flex;flex-direction:column;gap:6px;margin:0 2px}
.chip{background:#ffffff14;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff1f;border-radius:var(--r-lg);padding:10px 14px;font-size:14px;line-height:1.4;text-align:left;color:#fff;animation:riseIn .25s var(--ease-out) both}
.chip:hover{background:#ffffff1f}

.inputbar{position:relative;display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;grid-template-areas:"suggest caption imagine field send";
  align-items:center;gap:7px;padding:5px 5px 5px 6px;border-radius:var(--r-3xl);border:1px solid #ffffff29;
  background:var(--glass-dark);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity var(--dur)}
.inputbar.locked{opacity:.78}
.pill{min-height:44px;display:inline-flex;align-items:center;gap:4px;padding:0 11px;border-radius:var(--r-pill);background:#ffffff0f;border:1px solid #ffffff24;color:#ffffffb8;font-size:13px;font-weight:600;white-space:nowrap;transition:background var(--dur),border-color var(--dur),color var(--dur),opacity var(--dur)}
.pill .pill-ico{font-size:13px;opacity:.9}
.pill[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent-border);color:var(--accent)}
.suggest-btn{grid-area:suggest}.caption-btn{grid-area:caption}
.imagine-btn{grid-area:imagine;position:relative;opacity:.45}
.imagine-btn .pill-ico{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}
.imagine-btn.lit{opacity:1;background:#f06f862b;border-color:var(--rose);color:#ffc5cf;animation:imPulse 1.6s ease-in-out infinite}
.imagine-btn.lit .pill-ico{background:var(--rose-deep);border-color:var(--rose-deep)}
.imagine-btn[aria-pressed="true"]{background:#f06f8640;border-color:#ff9bae;color:#fff}
.imagine-badge{position:absolute;top:-6px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--rose-deep);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
.field{grid-area:field;resize:none;border:0;background:none;color:#fff;font-size:16px;line-height:1.4;padding:10px 4px;outline:0;max-height:96px;min-width:0;width:100%;font-family:inherit}
.field::placeholder{color:#fff9}
.field:disabled{color:#ffffffb0}
.send{grid-area:send;width:42px;height:42px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:opacity var(--dur),transform var(--dur)}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.38}
.send-arrow{width:0;height:0;border-style:solid;border-width:7px 0 7px 12px;border-color:transparent transparent transparent var(--on-accent);margin-left:3px}

/* 상상하기 카드 */
.imagine-card{position:relative;margin:0 2px;padding:14px 16px 12px;border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(135deg,#2b1a21,#1c1618 70%);border:1px solid #f06f8670;box-shadow:0 10px 30px #00000080, 0 0 0 1px #f06f8614;animation:riseIn .3s var(--ease-out) both}
.ic-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ic-list{display:flex;flex-direction:column;gap:10px}
.ic-item{padding:10px 0 0;border-top:1px solid #f06f8626}
.ic-item:first-child{padding-top:0;border-top:0}
.ic-item.seen .ic-kicker{color:#c99aa4}
.ic-row{display:flex;align-items:center;gap:10px}
.ic-row .ic-body{flex:1;margin:0}
.ic-item.seen .ic-watch{background:#ffffff1a;box-shadow:none;color:#ffd1da;border:1px solid #f06f8666}
.ic-note{font-size:12px;color:#ffd77a;margin-top:10px;line-height:1.5}
.ic-foot{display:flex;justify-content:flex-end;margin-top:10px}
.arm-toast{position:absolute;left:50%;transform:translateX(-50%);top:58px;z-index:3;background:#2a151be6;border:1px solid #f06f8699;color:#ffd1da;font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;white-space:nowrap;animation:riseIn .3s var(--ease-out) both;pointer-events:none}
@media (max-width:1023.98px){.arm-toast{top:calc(env(safe-area-inset-top,0px) + 148px)}}
.ic-kicker{font-size:12px;font-weight:700;color:#ff9bae;letter-spacing:.02em}
.age19{font-size:10px;font-weight:800;color:#fff;background:var(--rose-deep);border-radius:5px;padding:2px 5px;line-height:1}
.ic-wip{font-size:11px;font-weight:600;color:#ffd77a;border:1px solid #ffd77a66;border-radius:var(--r-pill);padding:2px 7px;margin-left:auto}
.ic-body{font-size:15px;line-height:1.5;color:#fff;word-break:keep-all;margin-bottom:12px}
.ic-actions{display:flex;gap:8px;align-items:center}
.ic-watch{flex:none;min-height:38px;padding:0 16px;border-radius:var(--r-pill);background:var(--rose);color:#fff;font-weight:700;font-size:14px;box-shadow:0 4px 14px #f06f8655;transition:transform var(--dur),filter var(--dur)}
.ic-watch:hover{filter:brightness(1.08)}.ic-watch:active{transform:scale(.96)}
.ic-skip{min-height:40px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--border-strong);color:var(--text-soft);font-size:14px}

/* 시연 조작 */
.presenter{position:absolute;left:12px;bottom:12px;z-index:9;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px}
.pr-toggle{height:34px;padding:0 12px;border-radius:var(--r-pill);background:var(--glass-dark);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff24;color:#ffffffcc;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pr-toggle b{color:#fff;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-panel{width:236px;padding:12px;border-radius:14px;background:#1e1e1ef0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff24;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:8px;font-size:13px;animation:riseIn .2s var(--ease-out) both}
.pr-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pr-btn{flex:1;min-height:34px;border-radius:9px;background:#ffffff12;border:1px solid #ffffff1f;color:#fff;font-size:12px;font-weight:600}
.pr-btn:hover{background:#ffffff1e}
.pr-panel label{display:flex;align-items:center;gap:8px;color:var(--text-soft);font-size:12px}
.pr-panel select{flex:1;min-width:0;background:#ffffff12;color:#fff;border:1px solid #ffffff1f;border-radius:8px;padding:6px 8px;font:inherit;font-size:12px}
.pr-panel input[type=checkbox]{accent-color:var(--rose)}
.pr-note{font-size:11px;color:var(--text-muted);line-height:1.5}

@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dots{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-4px);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes imPulse{0%{box-shadow:0 0 0 0 #f06f8680}70%{box-shadow:0 0 0 9px #f06f8600}100%{box-shadow:0 0 0 0 #f06f8600}}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ───────── 모바일 (<1024px): 실제 토모리 모바일 레이아웃 ───────── */
/* ───────── 시작 화면(표지) ───────── */
.cover{position:absolute;inset:0;z-index:30;background:var(--bg-deep);overflow:hidden;transition:opacity .45s ease}
.cover.out{opacity:0;pointer-events:none}
.cover-bg{position:absolute;inset:-10%;background:center/cover no-repeat;filter:blur(40px) brightness(.42) saturate(1.1);transform:scale(1.2)}
.cover-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%}
.cover-scrim{position:absolute;inset:0;background:linear-gradient(180deg,#00000000 38%,#000000a6 72%,#000000e6 100%)}
.cover-body{position:absolute;left:0;right:0;bottom:0;padding:0 24px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.cover-kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--text-soft)}
.cover-title{margin:0;font-size:clamp(30px,4.2vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#fff;text-shadow:0 2px 18px #000000b3;text-wrap:balance;word-break:keep-all;overflow-wrap:normal}
.cover-sub{margin:0;max-width:34em;font-size:14px;line-height:1.55;color:#e4e4e4;text-shadow:0 1px 8px #000}
.cover-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:12px;color:var(--text-soft)}
.cover-meta span+span::before{content:"·";margin-right:14px;color:var(--text-muted)}
.cover-start{margin-top:14px;display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 34px 0 26px;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:800;letter-spacing:-.01em;box-shadow:0 12px 36px #00000080;transition:transform .15s var(--ease-out),filter .15s}
.cover-start:hover{filter:brightness(1.06);transform:translateY(-1px)}
.cover-start:active{transform:translateY(1px) scale(.98)}
.cover-note{font-size:11px;color:var(--text-muted);margin-top:2px}
.hud-work{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}

@media (max-width:1023.98px){
  .player{display:block;max-width:none}
  .cover-art{object-fit:cover;object-position:50% 18%} .cover-bg{display:none} .cover-title{font-size:32px}
  .media{position:absolute;inset:0}
  .backdrop{display:none}
  .stage-video{object-fit:cover;object-position:50% 20%}
  .stage-scrim{display:block}
  .stage-tag{top:calc(env(safe-area-inset-top,0px) + 108px);max-width:92%}
  .hud{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;border:0;background:none}
  .backbtn{background:var(--glass-dark);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff24;color:#fff}
  .hud-name{color:#fff;text-shadow:0 1px 6px #0009}
  .hud-place{color:#ffffffd1;text-shadow:0 1px 6px #0009}
  .hud-demo{color:#ffffffb8;background:var(--glass-dark);border-color:#ffffff24}
  .overlay{position:absolute;left:0;right:0;bottom:0;height:var(--overlay-h);z-index:5;border:0;background:none}
  .player--peek .overlay{transform:translateY(calc(100% + 24px))}
  .convo{padding:28px 14px 10px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%);mask-image:linear-gradient(to bottom,transparent,#000 14%)}
  .scene-divider{color:#ffffffb0;text-shadow:0 1px 4px #0008}
  .scene-divider::before,.scene-divider::after{background:#ffffff33}
  .caption{max-width:92%;background:var(--glass-dark);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ffffffd1;border:0;border-radius:var(--r-sm);padding:6px 13px}
  .caption.imagine{color:#ffd1da;box-shadow:inset 0 0 0 1px #f06f8655}
  .bubble{background:var(--glass-dark);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:0;color:#fff}
  .user .bubble{background:var(--accent);color:var(--on-accent)}
  .who{color:#fff;text-shadow:0 1px 4px #0008}
  .end-note{color:#ffffffb0;text-shadow:0 1px 4px #0008}
  .dock{padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
  .media-controls{right:12px;bottom:calc(var(--overlay-h) + 12px)}
  .player--peek .media-controls{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  .icon-btn.peek{display:grid}
  .sound-hint{right:64px;bottom:calc(var(--overlay-h) + 18px)}
  .player--peek .sound-hint{bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
  .pill{padding:0 9px;font-size:12px;gap:3px}
  .field{font-size:16px;padding:10px 2px}
  .presenter{left:auto;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:auto;flex-direction:column;align-items:flex-end}
  .pr-toggle{height:30px;padding:0 10px;font-size:11px}
  .pr-toggle b{max-width:96px}
  .pr-panel{width:220px}
}
@media (max-width:380px){ .pill span:not(.pill-ico):not(.imagine-badge){display:none} .pill{padding:0 12px} .imagine-btn .pill-ico{width:13px;height:13px} }

const clock={kind:'video', t:0, dur:0, loop:false, ended:false};
setInterval(()=>{ if(clock.kind!=='still'||S.paused||clock.ended) return; clock.t+=0.05*S.speed; if(clock.t>=clock.dur){ if(clock.loop) clock.t=0; else { clock.t=clock.dur; clock.ended=true; } } },50);
const nowT=()=>clock.kind==='still'?clock.t:curV.currentTime;
const isEnded=()=>clock.kind==='still'?clock.ended:(curV.ended||(curV.duration&&curV.currentTime>=curV.duration-0.08));

class Interrupt extends Error{ constructor(k){ super(k); this.kind=k; } }
function sleep(ms){
  const id=S.runId; let left=ms;
  return new Promise((res,rej)=>{
    const tick=()=>{
      if(S.runId!==id) return rej(new Interrupt('cancel'));
      if(S.skip){ S.skip=false; return rej(new Interrupt('skip')); }
      if(S.imagineReq && !S.inImagine && S.imagineOK) return rej(new Interrupt('imagine'));
      if(!S.paused) left -= 50*S.speed;
      if(left<=0) return res();
      setTimeout(tick,50);
    };
    tick();
  });
}

async function showMedia(id,{loop=false,wip=null}={}){
  const m=MEDIA[id]||{kind:'none',stage:'없음',wip:true};
  const isWip = wip!==null ? wip : !!m.wip;
  $('media').classList.toggle('wip', isWip);
  if(isWip && !S.inImagine) baseTag('제작 중 · '+(m.kind==='none'?'결과 없음':m.stage),'wip'); else if(!S.inImagine) baseTag(null);
  if(m.kind==='video'){
    const v=nxtV;
    v.loop=loop; v.muted=!S.soundOn; v.playbackRate=S.speed; v.poster=P(id);
    if(v.getAttribute('data-name')!==id){ v.src=V(id); v.setAttribute('data-name',id); v.load(); } else v.currentTime=0;
    await new Promise(res=>{ let done=false; const f=()=>{ if(done) return; done=true; v.removeEventListener('canplay',f); res(); }; v.addEventListener('canplay',f); if(v.readyState>=3) f(); setTimeout(f,2500); });

    if(S.paused) v.pause();

    const st=STEPS.find(s=>s.media===id); const dur=(st&&st.dur)||8;

function waitPlaying(v){
  const id=S.runId; let waited=0;
  return new Promise((res,rej)=>{
    const tick=()=>{
      if(S.runId!==id) return rej(new Interrupt('cancel'));
      if(S.skip){ S.skip=false; return rej(new Interrupt('skip')); }
      if(!v.paused && v.currentTime>0.03) return res();

    };

function atTime(sec){
  const id=S.runId; let last=nowT();

    const tick=()=>{
      if(S.runId!==id) return rej(new Interrupt('cancel'));
      if(S.skip){ S.skip=false; return rej(new Interrupt('skip')); }
      if(S.imagineReq && !S.inImagine && S.imagineOK) return rej(new Interrupt('imagine'));

function otherBubble(name,t,note){ const r=document.createElement('div'); r.className='row other'; r.innerHTML='<div class="who"><span></span><span class="note"></span></div><div class="bubble"></div>'; r.querySelector('.who span').textContent=name||'?'; if(note) r.querySelector('.note').textContent='('+note+')'; r.querySelector('.bubble').textContent=t; convo.appendChild(r); scrollDown(); return r; }
let typingRow=null;
function typingOn(){ typingOff(); typingRow=botRow(); const b=document.createElement('div'); b.className='bubble typing'; b.innerHTML='<i></i><i></i><i></i>'; typingRow.appendChild(b); scrollDown(); }
function typingOff(){ if(typingRow){ typingRow.remove(); typingRow=null; } }
function lockComposer(ph){ $('inputbar').classList.add('locked'); field.disabled=true; field.value=''; field.placeholder=ph||'…'; btnSend.disabled=true; $('chips').hidden=true; $('btnSuggest').setAttribute('aria-pressed','false'); }
function unlockComposer(){ $('inputbar').classList.remove('locked'); field.disabled=false; field.placeholder='메시지를 입력하세요'; btnSend.disabled=false; }

/* 대본 한 줄: u=나(입력창 타이핑→전송) b=그녀(입력 중… 뒤) b0=그녀 즉시 o=다른 사람 c=지문 n=나레이션(지문 줄) w=대기ms t=영상 시각 */
async function doLine(l){
  const [k,t]=l;
  if(k==='u'){
    typingOff(); unlockComposer(); field.value=''; await sleep(500);
    for(const ch of t){ field.value+=ch; field.scrollTop=field.scrollHeight; await sleep(ch===' '?90:55+Math.random()*45); }
    await sleep(650); userBubble(t); field.value=''; await sleep(500);
  }else if(k==='b0'){ botBubble(t); }
  else if(k==='b'){ typingOn(); await sleep(1300+Math.min(1800,t.length*45)); typingOff(); botBubble(t); await sleep(900+Math.min(2600,t.length*40)); }
  else if(k==='o'){ otherBubble(l[2],t); await sleep(900+Math.min(2600,t.length*40)); }
  else if(k==='c'){ caption(t); await sleep(1500+Math.min(5200,t.length*48)); }
  else if(k==='n'){ caption(t,'narr'); await sleep(1800+Math.min(5200,t.length*55)); }
  else if(k==='w'){ await sleep(t); }
  else if(k==='t'){ await atTime(t); }
}
async function runChat(lines,{idleMedia}={}){
  for(let i=0;i<lines.length;i++){
    try{ await doLine(lines[i]); }
    catch(e){ if(e.kind==='imagine'){ typingOff(); field.value=''; await playImagine(idleMedia); i--; continue; } throw e; }
  }
}
/* 영상 위 사건: 각본 line = 그 시각 말풍선, what = 박자별 지문 */
function renderEvent(ev){
  if(ev.k==='c') caption(ev.text);
  else if(ev.k==='b0') botBubble(ev.text,ev.note);
  else if(ev.k==='u0') userBubble(ev.text);
  else if(ev.k==='o') otherBubble(ev.name,ev.text,ev.note);
}
async function playEvents(st){
  for(const ev of (st.events||[])){ await atTime(ev.t); renderEvent(ev); }
  if(st.arm && st.arm.length){ await atTime(Math.max(0,(st.dur||8)-1.5)); st.arm.forEach(armImagine); }
}
async function idleStart(id,next){ await showMedia(id,{loop:true}); if(next) preload(next); unlockComposer(); S.imagineOK=true; if(S.imagineReq) await playImagine(id); }
async function immStart(id,next){ S.imagineOK=false; clearImagine(); lockComposer('그녀를 바라보는 중…'); await showMedia(id); if(next) preload(next); }

/* ───────────── 상상하기 ───────────── */
function armImagine(key){
  if(S.armed.includes(key)||!IMAGINE[key]) return;
  S.armed.push(key);
  btnImagine.classList.add('lit'); badge.textContent=S.armed.length; badge.hidden=false;
  renderCard(); flashArm(key);
  autoTimers.forEach(clearTimeout); autoTimers=[];
  if(S.auto){
    autoTimers.push(setTimeout(()=>{ if(S.armed.includes(key)) openCard(); },2200/S.speed));
    autoTimers.push(setTimeout(()=>{ if(S.armed.includes(key) && !card.hidden) requestImagine(key); },4800/S.speed));
  }
}
function clearImagine(){ S.armed=[]; S.imagineReq=null; btnImagine.classList.remove('lit'); btnImagine.setAttribute('aria-pressed','false'); badge.hidden=true; card.hidden=true; icList.innerHTML=''; autoTimers.forEach(clearTimeout); autoTimers=[]; $('armToast').hidden=true; }
function flashArm(key){ const d=IMAGINE[key]; const t=$('armToast'); t.textContent='상상하기 열림 · '+d.part; t.hidden=false; clearTimeout(S.toastTimer); S.toastTimer=setTimeout(()=>{ t.hidden=true; },3200/S.speed); }
function renderCard(){
  icList.innerHTML='';
  S.armed.forEach((key,i)=>{
    const d=IMAGINE[key]; const it=document.createElement('div'); it.className='ic-item'+(S.watched[key]?' seen':'');
    it.innerHTML='<div class="ic-head"><span class="ic-kicker"></span><span class="age19">19</span><span class="ic-wip" hidden></span></div><div class="ic-row"><div class="ic-body"></div><button class="ic-watch" type="button"></button></div>';
    it.querySelector('.ic-kicker').textContent='상상하기 '+(i+1)+' · '+d.part;
    const w=it.querySelector('.ic-wip'); if(d.wip){ w.textContent='영상 제작 중'; w.hidden=false; }
    it.querySelector('.ic-body').textContent=d.title;
    const b=it.querySelector('.ic-watch'); b.textContent=S.watched[key]?'다시 보기':'보기'; b.addEventListener('click',()=>requestImagine(key));
    icList.appendChild(it);
  });
}
function openCard(){ if(!S.armed.length) return; renderCard(); card.hidden=false; btnImagine.setAttribute('aria-pressed','true'); $('chips').hidden=true; $('icNote').hidden=S.imagineOK; scrollDown(); }
function closeCard(){ card.hidden=true; btnImagine.setAttribute('aria-pressed','false'); }
function requestImagine(key){
  if(!S.armed.includes(key)) return;
  S.imagineReq=key; closeCard();
  if(!S.imagineOK){ const t=$('armToast'); t.textContent='몰입이 끝나면 바로 보여 드릴게요'; t.hidden=false; clearTimeout(S.toastTimer); S.toastTimer=setTimeout(()=>{ t.hidden=true; },2600/S.speed); }
}
async function playImagine(idleMedia){
  const key=S.imagineReq; S.imagineReq=null; S.inImagine=true; const d=IMAGINE[key];
  closeCard(); lockComposer('상상하는 중…'); typingOff(); $('armToast').hidden=true;
  try{
    $('vignette').hidden=false;
    if(d.clip){ stageTag('상상하기 · '+d.title,'rose'); await showMedia(d.clip,{loop:false,wip:false}); caption(d.narr,true); await waitEnd(16000); }
    else{ stageTag('상상하기 영상 제작 중 · '+d.part,'wip'); await showMedia(idleMedia,{loop:true,wip:true}); caption(d.narr,true); await sleep(6500); }
    S.watched[key]=true; renderCard();
    $('vignette').hidden=true; S.inImagine=false;
    await showMedia(idleMedia,{loop:true});
  }finally{ S.inImagine=false; $('vignette').hidden=true; restoreTag(); unlockComposer(); }
}

/* ───────────── 단계 실행: 단계 종류별 하나의 함수(친구 목업의 run 함수를 각본 데이터로) ───────────── */
function nextMedia(i){ for(let j=i+1;j<STEPS.length;j++) if(STEPS[j].media) return STEPS[j].media; return null; }
async function runStep(st,i){
  const nx=nextMedia(i);
  if(st.type==='prologue'){
    S.imagineOK=false; clearImagine(); lockComposer('프롤로그 재생 중…');
    if(st.divider){ convo.innerHTML=''; divider(st.divider); }
    await showMedia(st.media); preload(nx);
    await playEvents(st); await waitEnd((st.dur+4)*1000);
    await runChat(st.after||[],{idleMedia:st.media});
  }else if(st.type==='entry'){
    S.imagineOK=false; clearImagine(); lockComposer('그녀가 말하는 중…');
    if(st.divider) divider(st.divider);
    await showMedia(st.media); preload(nx);
    await playEvents(st); await waitEnd((st.dur+4)*1000);
    await runChat(st.after||[],{idleMedia:st.media});
  }else if(st.type==='imm'){
    await immStart(st.media,nx);
    if(st.divider) divider(st.divider);
    await playEvents(st); await waitEnd((st.dur+4)*1000);
    await runChat(st.after||[],{idleMedia:st.media});
  }else if(st.type==='idle'){
    if(st.divider) divider(st.divider);
    await idleStart(st.media,nx);
    await runChat(st.chat||[],{idleMedia:st.media});
  }else if(st.type==='teaser'){
    S.imagineOK=false; lockComposer('…'); await showMedia(st.media); preload(nx);
    await playEvents(st); await waitEnd((st.dur+4)*1000);
    await runChat(st.after||[],{idleMedia:st.media});
    if(S.armed.length){ S.imagineOK=true; await runChat([['w',6000]],{idleMedia:st.media}); S.imagineOK=false; }
  }else if(st.type==='end'){
    divider('데모 끝');
    const n=document.createElement('div'); n.className='end-note'; n.textContent=(st.note||'')+'오른쪽 위 ⚙ 시연에서 처음부터 다시 볼 수 있습니다.'; convo.appendChild(n); scrollDown();
    lockComposer('데모가 끝났습니다'); S.imagineOK=false; baseTag(null); await sleep(3600e5);
  }
}
async function runFrom(i){
  const id=++S.runId; S.imagineReq=null; S.inImagine=false; S.imagineOK=false; S.skip=false; typingOff(); baseTag(null); $('vignette').hidden=true; $('media').classList.remove('wip');
  for(let j=0;j<=i;j++){ if(STEPS[j].place) $('hudPlace').textContent=STEPS[j].place; }
  for(let k=i;k<STEPS.length;k++){
    if(S.runId!==id) return;
    S.step=k; const st=STEPS[k]; $('prStep').textContent=st.label; $('prJump').value=k;
    if(st.place) $('hudPlace').textContent=st.place;
    try{ await runStep(st,k); }
    catch(e){
      if(e.kind==='skip'){ typingOff(); S.inImagine=false; S.imagineReq=null; $('vignette').hidden=true; baseTag(null); $('media').classList.remove('wip'); continue; }
      if(e.kind==='cancel') return;
      if(e.kind==='imagine'){ S.imagineReq=null; continue; }
      console.error(e);
    }
  }
}

/* ───────────── 조작 ───────────── */
function setSound(on){ S.soundOn=on; vA.muted=!on; vB.muted=!on; $('btnSound').setAttribute('aria-pressed',on?'true':'false'); $('soundHint').hidden=true; if(on&&clock.kind==='video'){ const p=curV.play(); if(p) p.catch(()=>{}); } }
$('btnSound').addEventListener('click',e=>{ e.stopPropagation(); setSound(!S.soundOn); S.userMuted=!S.soundOn; });
$('btnReplay').addEventListener('click',()=>{ if(clock.kind==='still'){ clock.t=0; clock.ended=false; return; } curV.currentTime=0; const p=curV.play(); if(p) p.catch(()=>{}); });
$('btnPeek').addEventListener('click',()=>{ const on=!$('player').classList.contains('player--peek'); $('player').classList.toggle('player--peek',on); $('btnPeek').setAttribute('aria-pressed',on?'true':'false'); $('btnPeek').setAttribute('aria-label',on?'대화 보기':'사진 크게 보기'); });
$('btnImagine').addEventListener('click',()=>{ if(!S.armed.length) return; if(card.hidden) openCard(); else closeCard(); });
$('icSkip').addEventListener('click',closeCard);
/* 추천 칩: 각본에 칸이 없어서 비활성(칸이 생기면 DATA.chips 로) */
const CHIPS = DATA.chips || null;
if(!CHIPS){ $('btnSuggest').disabled=true; $('btnSuggest').title='각본에 추천(선택지) 문구 칸이 없습니다'; }
$('btnCaption').addEventListener('click',()=>{ const b=$('btnCaption'), on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on?'true':'false'); if(!field.disabled) field.placeholder=on?'*상황을 입력하세요*':'메시지를 입력하세요'; });
$('inputbar').addEventListener('submit',e=>{
  e.preventDefault(); const t=field.value.trim(); if(!t||field.disabled) return; field.value=''; userBubble(t);
  const id=S.runId; typingOn(); setTimeout(()=>{ if(S.runId!==id) return; typingOff(); const n=document.createElement('div'); n.className='end-note'; n.textContent='(데모: 자유 입력 답장은 각본에 없습니다)'; convo.appendChild(n); scrollDown(); },1200);
});
field.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('inputbar').requestSubmit(); } });

STEPS.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=s.label+(s.media&&MEDIA[s.media]&&MEDIA[s.media].wip?' · 제작 중':''); $('prJump').appendChild(o); });
$('prToggle').addEventListener('click',()=>{ const p=$('prPanel'); p.hidden=!p.hidden; $('prToggle').setAttribute('aria-expanded',p.hidden?'false':'true'); });
$('prPause').addEventListener('click',()=>{ S.paused=!S.paused; $('prPause').textContent=S.paused?'▶ 재생':'⏸ 일시정지'; if(clock.kind!=='video') return; if(S.paused) curV.pause(); else { const p=curV.play(); if(p) p.catch(()=>{}); } });
$('prNext').addEventListener('click',()=>{ S.skip=true; });
$('prRestart').addEventListener('click',()=>{ runFrom(0); });
$('prJump').addEventListener('change',e=>{ const k=+e.target.value; if(k===0){ runFrom(0); return; } convo.innerHTML=''; clearImagine(); runFrom(k); });
$('prSpeed').addEventListener('change',e=>{ S.speed=+e.target.value; vA.playbackRate=S.speed; vB.playbackRate=S.speed; });
$('prAuto').addEventListener('change',e=>{ S.auto=e.target.checked; if(S.auto && S.armed.length){ const k=S.armed[S.armed.length-1]; openCard(); autoTimers.push(setTimeout(()=>{ if(!card.hidden) requestImagine(k); },2600/S.speed)); } });

/* 재생 게이트(친구 목업 그대로) */
function showGate(){ if(S.gateDone) return; $('playGate').hidden=false; $('soundHint').hidden=true; if(!S.paused){ S.paused=true; S.gatePause=true; } }
function hideGate(){ $('playGate').hidden=true; if(S.gatePause){ S.gatePause=false; S.paused=false; } }
$('playGate').addEventListener('click',e=>{ e.stopPropagation(); S.gateDone=true; hideGate(); if(!S.userMuted) setSound(true); else if(clock.kind==='video'){ const p=curV.play(); if(p) p.catch(()=>{}); } });
const tryPlay=(v,ms)=>Promise.race([v.play(), new Promise(res=>setTimeout(()=>res('pending'),ms))]).then(r=>r==='pending'?'pending':'ok', e=>(e&&e.name)||'err');
const FIRST_VIDEO = (STEPS.find(s=>s.media && MEDIA[s.media] && MEDIA[s.media].kind==='video')||{}).media;
async function boot(){
  if(!FIRST_VIDEO){ setSound(false); $('soundHint').hidden=false; setTimeout(()=>{ $('soundHint').hidden=true; },9000); runFrom(0); return; }
  vA.src=V(FIRST_VIDEO); vA.setAttribute('data-name',FIRST_VIDEO); vA.load();
  vA.muted=false; const r1=await tryPlay(vA,1500);
  const ok = r1!=='NotAllowedError' && r1!=='err';
  try{ vA.pause(); vA.currentTime=0; }catch(e){}
  setSound(ok);
  if(!ok){
    const unlock=()=>{ S.gateDone=true; hideGate(); if(!S.userMuted) setSound(true); document.removeEventListener('pointerdown',unlock,true); document.removeEventListener('keydown',unlock,true); };
    document.addEventListener('pointerdown',unlock,true); document.addEventListener('keydown',unlock,true);
    vA.muted=true; const r2=await tryPlay(vA,1500);
    try{ vA.pause(); vA.currentTime=0; }catch(e){}
    if(r2==='NotAllowedError'||r2==='err') showGate();
    else { $('soundHint').hidden=false; setTimeout(()=>{ $('soundHint').hidden=true; },9000); }
  }
  runFrom(0);
}
for(const v of [vA,vB]) v.addEventListener('playing',()=>{ if(!S.gateDone && !$('playGate').hidden){ S.gateDone=true; hideGate(); } });
let gateChecks=0; const gateTimer=setInterval(()=>{
  if(S.gateDone || ++gateChecks>20){ clearInterval(gateTimer); return; }
  if(clock.kind==='video' && curV.readyState>=3 && curV.paused && !S.paused && curV.currentTime<0.3 && curV.classList.contains('on')) showGate();
},1000);

/* 표지·HUD: 각본 칸에서 */
document.title = META.title + ' · ' + META.name + ' 채팅 목업';
$('coverTitle').textContent=META.title; $('coverSub').textContent=META.sub;
{ const nImg=Object.keys(IMAGINE).filter(k=>STEPS.some(s=>(s.arm||[]).includes(k))).length; const wipN=STEPS.filter(s=>s.media&&MEDIA[s.media]&&MEDIA[s.media].wip).length;
  [META.name+(META.age?' · '+META.age.replace('세',''):''), '프롤로그·씬 1'+(META.until==='S1'?'':'~'+META.until.slice(1))+' 데모', '상상하기 '+nImg+'칸'+(Object.values(IMAGINE).some(d=>d.clip)?'':'(영상 없음)'), '제작 중 '+wipN+'/'+STEPS.filter(s=>s.media).length+'자리', '내부 데모']
  .forEach(t=>{ const s=document.createElement('span'); s.textContent=t; $('coverMeta').appendChild(s); }); }
$('hudWork').textContent=META.title; $('hudName').textContent=META.first; $('hudRole').textContent=META.role;
function startFromCover(){ const c=$('cover'); if(c.classList.contains('out')) return; c.classList.add('out'); setTimeout(()=>{ c.hidden=true; },500); boot(); }
$('btnStart').addEventListener('click',startFromCover);
if(FIRST_VIDEO){ vA.src=V(FIRST_VIDEO); vA.setAttribute('data-name',FIRST_VIDEO); vA.load(); }
</script>
