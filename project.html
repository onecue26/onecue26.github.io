<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진행 상황 — onecue</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="style.css?v=client-concept-readable-260921">

<style>
.hero{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hero h1{margin:0;font-size:27px;letter-spacing:-.02em}
.hero .brand-name{display:flex;align-items:center;gap:7px;margin-bottom:4px;color:var(--muted);font-size:13px;font-weight:700}
.hero .brand-name span{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.08em;color:var(--cue);border:1px solid var(--cue);padding:2px 5px}
.hero .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.hero>div{width:100%}
.progress-scroll{width:100%;overflow-x:auto;padding-bottom:4px}
.hero .bar{margin-top:12px;min-width:765px}
.hero .bar i{width:auto;flex:1;height:6px}
.stepnames{display:grid;grid-template-columns:repeat(9,minmax(82px,1fr));gap:3px;margin-top:6px;min-width:765px}
.stepnames span{font-size:10px;color:var(--faint);text-align:center;
  font-family:"JetBrains Mono",monospace;line-height:1.35;letter-spacing:0}
.pickbtn{margin-top:10px}
/* 의뢰 내용 고치기 */
.ed-l{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px;
  font-family:"JetBrains Mono",monospace}
.ed-l:first-child{margin-top:0}
.ed-t,.ed-i{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;
  background:var(--ground);color:var(--ink);font-family:inherit;font-size:14.5px;line-height:1.6}
.ed-t{min-height:130px;resize:vertical}
.ed-t:focus,.ed-i:focus{outline:2px solid var(--cue);outline-offset:1px;border-color:var(--cue)}
h2 #editBrief{margin-left:auto}
/* 보내주신 자료 */
.files{display:flex;flex-wrap:wrap;gap:10px}
.files a{width:96px;display:block}
.files img{width:96px;height:96px;object-fit:cover;border-radius:8px;
  border:1px solid var(--rule);display:block;background:var(--sunk)}
.files .doc{width:96px;height:96px;border-radius:8px;border:1px solid var(--rule);
  background:var(--sunk);display:flex;align-items:center;justify-content:center;
  font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}
.files em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files a:hover img,.files a:hover .doc{border-color:var(--cue)}
</style>
<link rel="stylesheet" href="studio.css?v=2"><script defer src="studio-shell.js?v=3"></script>
<link rel="stylesheet" href="brand.css?v=red1"></head>
<body>

<div class="topbar"><div class="topbar-in">
  <a class="mark" href="index.html"><span class="lamp"></span>onecue
    <span class="sub">광고 기획 · 제작</span></a>
  <div class="spacer"></div>
  <span class="pill" id="conn"><span class="dot"></span>연결 확인 중</span>
  <span class="acct" id="acct"></span>
</div></div>

<main id="main">
  <div class="empty"><span class="big">불러오는 중</span></div>
</main>

<div class="zoom" id="zoom"><img id="zoomImg" alt=""></div>

</html>
